<!DOCTYPE html>
<html lang="es">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Q&V Tech</title>

  <meta
    name="description"
    content="Tu negocio, a un toque de distancia."
  >

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>

    :root{

      --verde:#4A9B3E;
      --verde-oscuro:#16330F;
      --verde-claro:#8FC46A;

      --blanco:#FFFFFF;

      --fondo:#3C7F33;

      --texto-suave:
        rgba(255,255,255,.78);

      --sombra:
        0 20px 60px rgba(0,0,0,.18);

    }


    *{

      box-sizing:border-box;

      margin:0;
      padding:0;

    }


    body{

      min-height:100vh;

      font-family:
        'IBM Plex Sans',
        Arial,
        Helvetica,
        sans-serif;

      background:

        radial-gradient(
          circle at top right,
          rgba(143,196,106,.5),
          transparent 35%
        ),

        linear-gradient(
          145deg,
          #16330F 0%,
          #3C7F33 55%,
          #4A9B3E 100%
        );

      color:
        var(--blanco);

    }


    a{

      text-decoration:none;

      color:inherit;

    }


    .page{

      width:100%;

      max-width:620px;

      margin:0 auto;

      min-height:100vh;

      padding:
        35px
        20px
        30px;

      display:flex;

      flex-direction:column;

    }


    .brand{

      text-align:center;

      margin-bottom:28px;

    }


    .brand-mark{

      font-family:
        'Space Grotesk',
        sans-serif;

      font-size:1.45rem;

      font-weight:700;

      letter-spacing:-.5px;

    }


    .brand-tag{

      margin-top:5px;

      font-size:.82rem;

      color:
        var(--texto-suave);

    }


    #contenido{

      width:100%;

    }


    .card{

      width:100%;

      padding:
        30px
        22px
        25px;

      border-radius:28px;

      background:
        rgba(255,255,255,.08);

      border:
        1px solid
        rgba(255,255,255,.15);

      backdrop-filter:
        blur(14px);

      -webkit-backdrop-filter:
        blur(14px);

      box-shadow:
        var(--sombra);

      text-align:center;

    }


    .logo-wrap{

      display:flex;

      align-items:center;

      justify-content:center;

      margin-bottom:17px;

    }


    .logo-wrap img,
    .logo-fallback{

      width:100px;

      height:100px;

      border-radius:50%;

      object-fit:cover;

      background:white;

      border:
        3px solid
        rgba(255,255,255,.75);

      box-shadow:
        0 10px 35px
        rgba(0,0,0,.2);

    }


    .logo-fallback{

      display:flex;

      align-items:center;

      justify-content:center;

      background:
        var(--blanco);

      color:
        var(--verde-oscuro);

      font-family:
        'Space Grotesk',
        sans-serif;

      font-size:30px;

      font-weight:700;

    }


    .negocio{

      font-family:
        'Space Grotesk',
        sans-serif;

      font-size:2rem;

      line-height:1.1;

      margin-bottom:7px;

      word-break:break-word;

    }


    .categoria{

      font-size:.85rem;

      color:
        rgba(255,255,255,.7);

      margin-bottom:13px;

    }


    .descripcion{

      max-width:480px;

      margin:
        0 auto
        20px;

      color:
        rgba(255,255,255,.84);

      font-size:.95rem;

      line-height:1.55;

    }


    .botones{

      display:grid;

      gap:10px;

      width:100%;

    }


    .boton{

      width:100%;

      min-height:52px;

      display:flex;

      align-items:center;

      justify-content:center;

      gap:10px;

      padding:
        13px
        16px;

      border-radius:14px;

      background:white;

      color:
        var(--verde-oscuro);

      font-weight:700;

      font-size:.95rem;

      transition:
        transform .15s ease,
        box-shadow .15s ease,
        background .15s ease;

    }


    .boton:hover{

      transform:
        translateY(-2px);

      box-shadow:
        0 8px 22px
        rgba(0,0,0,.15);

    }


    .boton:active{

      transform:
        translateY(0);

    }


    .boton.principal{

      background:
        var(--verde-claro);

      color:
        var(--verde-oscuro);

    }


    .boton.review{

      background:#fff;

      color:#333;

    }


    .icono{

      font-size:1.15rem;

      width:24px;

      display:inline-flex;

      justify-content:center;

    }


    .estado-vacio{

      width:100%;

      padding:
        50px
        20px;

      text-align:center;

    }


    .estado-vacio h2{

      font-family:
        'Space Grotesk',
        sans-serif;

      margin-bottom:10px;

      font-size:1.5rem;

    }


    .estado-vacio p{

      color:
        var(--texto-suave);

      font-size:.9rem;

      line-height:1.55;

    }


    .cargando{

      text-align:center;

      padding:
        50px
        20px;

      color:
        var(--texto-suave);

    }


    .spinner{

      width:34px;

      height:34px;

      margin:
        0 auto
        15px;

      border:
        3px solid
        rgba(255,255,255,.25);

      border-top-color:
        white;

      border-radius:50%;

      animation:
        girar .8s linear infinite;

    }


    @keyframes girar{

      to{

        transform:
          rotate(360deg);

      }

    }


    footer{

      text-align:center;

      margin-top:auto;

      padding-top:28px;

      font-size:.78rem;

      color:
        rgba(255,255,255,.6);

      line-height:1.6;

    }


    footer strong{

      color:white;

    }


    @media(max-width:480px){

      .page{

        padding:
          25px
          14px
          25px;

      }


      .card{

        padding:
          25px
          17px
          22px;

        border-radius:23px;

      }


      .negocio{

        font-size:1.7rem;

      }


      .logo-wrap img,
      .logo-fallback{

        width:90px;

        height:90px;

      }

    }

  </style>

</head>


<body>


<div class="page">


  <div class="brand">

    <div class="brand-mark">

      Q&amp;V Tech

    </div>


    <div class="brand-tag">

      Tu negocio, a un toque de distancia

    </div>

  </div>


  <div id="contenido">

    <div class="cargando">

      <div class="spinner"></div>

      Cargando perfil...

    </div>

  </div>


  <footer
    id="footer"
    style="display:none;"
  >

    Creado por
    <strong>Q&amp;V Tech</strong>

    <br>

    Tu negocio, a un toque de distancia

  </footer>


</div>


<!-- =========================================
     SUPABASE
     ========================================= -->

<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<script>

(function(){

  "use strict";


  /*
   * =========================================
   * COMPROBAR SUPABASE
   * =========================================
   */

  if(
    !window.supabase ||
    typeof window.supabase.createClient !==
      "function"
  ){

    console.error(
      "Supabase no pudo cargarse."
    );

    renderErrorInicial(
      "No se pudo conectar con el sistema de perfiles."
    );

    return;

  }


  /*
   * =========================================
   * CONFIGURACIÓN SUPABASE
   * =========================================
   */

  const SUPABASE_URL =
    "https://ytwrvkjwvtpukildqkvn.supabase.co";


  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_proebV8BLmQCRZFVs122sw_mGijl6vA";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  /*
   * =========================================
   * UTILIDADES
   * =========================================
   */

  function iniciales(nombre){

    const partes =
      (nombre || "?")
        .trim()
        .split(/\s+/)
        .filter(Boolean)
        .slice(0,2);


    if(!partes.length){

      return "?";

    }


    return partes
      .map(
        p =>
          p.charAt(0)
      )
      .join("")
      .toUpperCase();

  }


  function normalizarUrl(url){

    if(!url){

      return "";

    }


    const valor =
      String(url).trim();


    if(!valor){

      return "";

    }


    if(
      /^https?:\/\//i.test(valor)
    ){

      return valor;

    }


    return "https://" + valor;

  }


  function linkWhatsApp(numero){

    let limpio =
      String(numero || "")
        .replace(/[^\d]/g,"");


    if(
      limpio.startsWith("0")
    ){

      limpio =
        "56" +
        limpio.substring(1);

    }


    if(
      limpio.length === 9 &&
      limpio.startsWith("9")
    ){

      limpio =
        "56" +
        limpio;

    }


    if(!limpio){

      return "";

    }


    return "https://wa.me/" + limpio;

  }


  function crearBoton({

    icono,
    texto,
    url,
    clase = ""

  }){

    if(!url){

      return null;

    }


    const a =
      document.createElement("a");


    a.className =
      "boton" +
      (
        clase
          ? " " + clase
          : ""
      );


    a.href =
      url;


    a.target =
      "_blank";


    a.rel =
      "noopener noreferrer";


    const icon =
      document.createElement("span");


    icon.className =
      "icono";


    icon.textContent =
      icono;


    const label =
      document.createElement("span");


    label.textContent =
      texto;


    a.appendChild(icon);

    a.appendChild(label);


    return a;

  }


  /*
   * =========================================
   * MAPEAR BASE DE DATOS
   * =========================================
   */

  function mapearDesdeBD(row){

    return {

      id:
        row.id,

      nombre:
        row.business_name || "",

      slug:
        row.slug || "",

      categoria:
        row.categoria || "",

      descripcion:
        row.description || "",

      logo:
        row.logo_url || "",

      activo:
        row.active !== false,

      whatsapp:
        row.whatsapp || "",

      telefono:
        row.phone || "",

      correo:
        row.email || "",

      direccion:
        row.address || "",

      google_maps:
        row.google_maps || "",

      sitio_web:
        row.website || "",

      instagram:
        row.instagram || "",

      facebook:
        row.facebook || "",

      tiktok:
        row.tiktok || "",

      youtube:
        row.youtube || "",

      google_reviews:
        row.google_reviews || "",

      mostrar_reviews:
        row.mostrar_reviews === true,

      menu_url:
        row.menu_url || "",

      reservations_url:
        row.reservations_url || "",

      botones:
        Array.isArray(row.botones)
          ? row.botones
          : []

    };

  }


  /*
   * =========================================
   * RENDER CLIENTE
   * =========================================
   */

  function renderCliente(cliente){

    const contenido =
      document.getElementById(
        "contenido"
      );


    contenido.innerHTML =
      "";


    const card =
      document.createElement(
        "div"
      );


    card.className =
      "card";


    /*
     * LOGO
     */

    const logoWrap =
      document.createElement(
        "div"
      );


    logoWrap.className =
      "logo-wrap";


    if(cliente.logo){

      const img =
        document.createElement(
          "img"
        );


      img.src =
        cliente.logo;


      img.alt =
        "Logo de " +
        cliente.nombre;


      img.onerror =
        function(){

          this.style.display =
            "none";


          logoWrap.innerHTML =
            "";


          const fallback =
            document.createElement(
              "div"
            );


          fallback.className =
            "logo-fallback";


          fallback.textContent =
            iniciales(
              cliente.nombre
            );


          logoWrap.appendChild(
            fallback
          );

        };


      logoWrap.appendChild(
        img
      );

    }else{

      const fallback =
        document.createElement(
          "div"
        );


      fallback.className =
        "logo-fallback";


      fallback.textContent =
        iniciales(
          cliente.nombre
        );


      logoWrap.appendChild(
        fallback
      );

    }


    card.appendChild(
      logoWrap
    );


    /*
     * NOMBRE
     */

    const h1 =
      document.createElement(
        "h1"
      );


    h1.className =
      "negocio";


    h1.textContent =
      cliente.nombre ||
      "Negocio";


    card.appendChild(
      h1
    );


    /*
     * CATEGORÍA
     */

    if(cliente.categoria){

      const cat =
        document.createElement(
          "div"
        );


      cat.className =
        "categoria";


      cat.textContent =
        cliente.categoria;


      card.appendChild(
        cat
      );

    }


    /*
     * DESCRIPCIÓN
     */

    if(cliente.descripcion){

      const desc =
        document.createElement(
          "p"
        );


      desc.className =
        "descripcion";


      desc.textContent =
        cliente.descripcion;


      card.appendChild(
        desc
      );

    }


    /*
     * BOTONES
     */

    const botonesWrap =
      document.createElement(
        "div"
      );


    botonesWrap.className =
      "botones";


    function agregarBoton(
      icono,
      texto,
      url,
      clase = ""
    ){

      const boton =
        crearBoton({

          icono,
          texto,
          url,
          clase

        });


      if(boton){

        botonesWrap.appendChild(
          boton
        );

      }

    }


    /*
     * WHATSAPP
     */

    if(cliente.whatsapp){

      const whatsappUrl =
        linkWhatsApp(
          cliente.whatsapp
        );


      if(whatsappUrl){

        agregarBoton(

          "💬",

          "WhatsApp",

          whatsappUrl,

          "principal"

        );

      }

    }


    /*
     * TELÉFONO
     */

    if(cliente.telefono){

      agregarBoton(

        "📞",

        "Llamar",

        "tel:" +
        cliente.telefono

      );

    }


    /*
     * INSTAGRAM
     */

    if(cliente.instagram){

      agregarBoton(

        "📷",

        "Instagram",

        normalizarUrl(
          cliente.instagram
        )

      );

    }


    /*
     * FACEBOOK
     */

    if(cliente.facebook){

      agregarBoton(

        "👍",

        "Facebook",

        normalizarUrl(
          cliente.facebook
        )

      );

    }


    /*
     * TIKTOK
     */

    if(cliente.tiktok){

      agregarBoton(

        "🎵",

        "TikTok",

        normalizarUrl(
          cliente.tiktok
        )

      );

    }


    /*
     * YOUTUBE
     */

    if(cliente.youtube){

      agregarBoton(

        "▶️",

        "YouTube",

        normalizarUrl(
          cliente.youtube
        )

      );

    }


    /*
     * CORREO
     */

    if(cliente.correo){

      agregarBoton(

        "✉️",

        "Enviar correo",

        "mailto:" +
        cliente.correo

      );

    }


    /*
     * GOOGLE MAPS
     */

    if(cliente.google_maps){

      agregarBoton(

        "📍",

        "Cómo llegar",

        normalizarUrl(
          cliente.google_maps
        )

      );

    }


    /*
     * SITIO WEB
     */

    if(cliente.sitio_web){

      agregarBoton(

        "🌐",

        "Sitio web",

        normalizarUrl(
          cliente.sitio_web
        )

      );

    }


    /*
     * MENÚ
     */

    if(cliente.menu_url){

      agregarBoton(

        "📋",

        "Menú",

        normalizarUrl(
          cliente.menu_url
        )

      );

    }


    /*
     * RESERVAS
     */

    if(cliente.reservations_url){

      agregarBoton(

        "📅",

        "Reservas",

        normalizarUrl(
          cliente.reservations_url
        )

      );

    }


    /*
     * BOTONES PERSONALIZADOS
     */

    if(
      Array.isArray(
        cliente.botones
      )
    ){

      cliente.botones.forEach(
        boton => {

          if(
            boton &&
            boton.titulo &&
            boton.url
          ){

            agregarBoton(

              "🔗",

              boton.titulo,

              normalizarUrl(
                boton.url
              )

            );

          }

        }
      );

    }


    /*
     * GOOGLE REVIEWS
     */

    if(
      cliente.mostrar_reviews &&
      cliente.google_reviews
    ){

      agregarBoton(

        "⭐",

        "Déjanos una reseña en Google",

        normalizarUrl(
          cliente.google_reviews
        ),

        "review"

      );

    }


    card.appendChild(
      botonesWrap
    );


    contenido.appendChild(
      card
    );


    document
      .getElementById("footer")
      .style.display =
      "block";


    document.title =
      cliente.nombre
        ? cliente.nombre +
          " | Q&V Tech"
        : "Q&V Tech";

  }


  /*
   * =========================================
   * ERROR INICIAL
   * =========================================
   */

  function renderErrorInicial(
    mensaje
  ){

    const contenido =
      document.getElementById(
        "contenido"
      );


    if(!contenido){

      return;

    }


    contenido.innerHTML =
      "";


    const estado =
      document.createElement(
        "div"
      );


    estado.className =
      "estado-vacio";


    const titulo =
      document.createElement(
        "h2"
      );


    titulo.textContent =
      "Página no disponible";


    const texto =
      document.createElement(
        "p"
      );


    texto.textContent =
      mensaje;


    estado.appendChild(
      titulo
    );


    estado.appendChild(
      texto
    );


    contenido.appendChild(
      estado
    );

  }


  /*
   * =========================================
   * PÁGINA VACÍA / ERROR
   * =========================================
   */

  function renderVacio(
    mensaje
  ){

    renderErrorInicial(
      mensaje
    );

  }


  /*
   * =========================================
   * CARGAR PERFIL
   * =========================================
   */

  async function cargarPerfil(){

    const params =
      new URLSearchParams(
        window.location.search
      );


    let slug =
      params.get("c");


    slug =
      slug
        ? slug.trim()
        : "";


    if(!slug){

      renderVacio(
        "No se especificó ningún negocio en el enlace."
      );

      return;

    }


    document.getElementById(
      "contenido"
    ).innerHTML = `

      <div class="cargando">

        <div class="spinner"></div>

        Cargando perfil...

      </div>

    `;


    try{

      console.log(
        "Buscando perfil:",
        slug
      );


      const {

        data,

        error

      } = await supabaseClient

        .from(
          "client_profiles"
        )

        .select("*")

        .eq(
          "slug",
          slug
        )

        .eq(
          "active",
          true
        )

        .maybeSingle();


      console.log(
        "Resultado Supabase:",
        {
          data,
          error
        }
      );


      if(error){

        console.error(
          "Error Supabase:",
          error
        );


        throw new Error(
          error.message ||
          "No se pudo consultar Supabase."
        );

      }


      if(!data){

        renderVacio(

          "El perfil \"" +
          slug +
          "\" no existe o está desactivado."

        );

        return;

      }


      const cliente =
        mapearDesdeBD(
          data
        );


      renderCliente(
        cliente
      );


    }catch(error){

      console.error(
        "Error cargando perfil:",
        error
      );


      renderVacio(

        "No se pudo cargar este perfil. Revisa la consola del navegador para ver el error."

      );

    }

  }


  /*
   * =========================================
   * INICIO
   * =========================================
   */

  cargarPerfil();


})();

</script>


</body>
</html>
